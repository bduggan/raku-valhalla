name: MacOS

# push covers the default branch; every other branch is already covered by
# pull_request. Listing both for all branches ran each PR commit twice.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  VALHALLA_PREFIX: /usr/local/valhalla

jobs:
  raku:
    runs-on: macos-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        raku-version: ['latest']
    steps:
      - uses: actions/checkout@v4

      - uses: Raku/setup-raku@v1
        with:
          raku-version: ${{ matrix.raku-version }}

      # One source of truth for the version, shared with the Linux workflow.
      - name: Pin Valhalla version
        run: echo "VALHALLA_VERSION=$(cat .github/valhalla-version)" >> "$GITHUB_ENV"

      - name: Install build dependencies
        run: .github/scripts/macos-install-deps.sh

      # Keyed on the version *and* the build recipe, so changing the cmake flags
      # rebuilds instead of silently restoring the previous build.
      - name: Cache Valhalla install
        id: cache-valhalla
        uses: actions/cache@v4
        with:
          path: ${{ env.VALHALLA_PREFIX }}
          key: valhalla-${{ runner.os }}-${{ runner.arch }}-${{ env.VALHALLA_VERSION }}-${{ hashFiles('.github/scripts/macos-install-valhalla.sh') }}

      - name: Build and install Valhalla
        if: steps.cache-valhalla.outputs.cache-hit != 'true'
        run: .github/scripts/macos-install-valhalla.sh

      - name: Expose Valhalla to pkg-config and the loader
        run: |
          echo "PKG_CONFIG_PATH=$VALHALLA_PREFIX/lib/pkgconfig" >> "$GITHUB_ENV"
          echo "DYLD_LIBRARY_PATH=$GITHUB_WORKSPACE/resources/libraries:$VALHALLA_PREFIX/lib" >> "$GITHUB_ENV"

      - name: Build native shim
        run: ./make-lib

      - name: Install Raku dependencies
        run: zef install --deps-only .

      - name: Run tests
        run: zef test -v .
