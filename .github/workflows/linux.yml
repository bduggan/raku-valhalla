name: Linux

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  raku:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # The official Valhalla image has libvalhalla preinstalled, so the build
    # here is the same as the README's: install Valhalla, run ./make lib.
    # Keep the version in sync with macos.yml.
    container: ghcr.io/valhalla/valhalla:3.7.0
    steps:
      - uses: actions/checkout@v4

      # The apt list from valhalla's scripts/install-linux-deps.sh (3.7.0),
      # verbatim. That script then builds prime_server from git master, which
      # we must NOT do: the image already ships the prime_server its
      # libvalhalla.a was compiled against, and a newer one breaks the link.
      - name: Install Valhalla build dependencies
        run: |
          apt-get -qq update
          DEBIAN_FRONTEND=noninteractive apt-get install -qq -y --quiet \
            autoconf automake ccache clang clang-tidy coreutils curl cmake \
            g++ gcc git jq lcov libboost-all-dev libcurl4-openssl-dev \
            libczmq-dev libgdal-dev libgeos++-dev libgeos-dev \
            libluajit-5.1-dev liblz4-dev libprotobuf-dev libspatialite-dev \
            libsqlite3-dev libsqlite3-mod-spatialite libtool libzmq3-dev lld \
            locales luajit make osmium-tool parallel pkgconf \
            protobuf-compiler python3-all-dev python3-shapely \
            python3-requests python3-pip spatialite-bin unzip zlib1g-dev

      # The shim links libgeotiff directly: it is on by default in Valhalla
      # but absent from libvalhalla.pc, and missing from the list above.
      - name: Install shim link dependencies
        run: |
          DEBIAN_FRONTEND=noninteractive apt-get install -qq -y --no-install-recommends \
            libgeotiff-dev

      - uses: Raku/setup-raku@v1
        with:
          raku-version: latest

      - name: Build native shim
        run: ./make-lib

      - name: Install Raku dependencies
        run: zef install --deps-only .

      - name: Run tests
        run: zef test -v .
