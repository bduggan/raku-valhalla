name: Linux

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  raku:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # The official Valhalla image has libvalhalla preinstalled, so the build
    # here is the same as the README's: install Valhalla, run ./make lib.
    # Keep the version in sync with macos.yml.
    container: ghcr.io/valhalla/valhalla:3.7.0
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          apt-get -qq update
          DEBIAN_FRONTEND=noninteractive apt-get install -qq -y --no-install-recommends \
            build-essential pkg-config git curl ca-certificates \
            libboost-dev libcurl4-openssl-dev libczmq-dev libgeos-dev \
            libgeotiff-dev libluajit-5.1-dev liblz4-dev libproj-dev \
            libprotobuf-dev libspatialite-dev libsqlite3-dev libssl-dev \
            libtiff-dev libzmq3-dev zlib1g-dev

      - uses: Raku/setup-raku@v1
        with:
          raku-version: latest

      - name: Build native shim
        run: ./make-lib

      - name: Install Raku dependencies
        run: zef install --deps-only .

      - name: Run tests
        run: zef test -v .
