name: Linux

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  raku:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # The official Valhalla image has libvalhalla preinstalled, so the build
    # here is the same as the README's: install Valhalla, run ./make lib.
    # Keep the version in sync with macos.yml.
    container: ghcr.io/valhalla/valhalla:3.7.0
    steps:
      - uses: actions/checkout@v4

      # Valhalla's own dependency script, per docs/building.md, from the same
      # pinned version as the image.
      - name: Install Valhalla build dependencies
        run: |
          apt-get -qq update
          DEBIAN_FRONTEND=noninteractive apt-get install -qq -y sudo curl ca-certificates
          curl -sSf https://raw.githubusercontent.com/valhalla/valhalla/3.7.0/scripts/install-linux-deps.sh | bash

      # The image ships only the static libvalhalla.a, so `pkg-config --static`
      # also asks for libcurl's private deps, and the shim links libgeotiff
      # (on by default in Valhalla but absent from its Libs.private).
      - name: Install shim link dependencies
        run: |
          DEBIAN_FRONTEND=noninteractive apt-get install -qq -y --no-install-recommends \
            libgeotiff-dev libbrotli-dev libidn2-dev libldap-dev \
            libnghttp2-dev libpsl-dev librtmp-dev libssh-dev

      - uses: Raku/setup-raku@v1
        with:
          raku-version: latest

      - name: Build native shim
        run: ./make-lib

      - name: Install Raku dependencies
        run: zef install --deps-only .

      - name: Run tests
        run: zef test -v .
