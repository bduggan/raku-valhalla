name: Linux

# push covers the default branch; every other branch is already covered by
# pull_request. Listing both for all branches ran each PR commit twice.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  raku:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        raku-version: ['latest']
    steps:
      - uses: actions/checkout@v4

      - uses: Raku/setup-raku@v1
        with:
          raku-version: ${{ matrix.raku-version }}

      - name: Build native shim
        run: .github/scripts/linux-build.sh

      - name: Install runtime dependencies
        run: .github/scripts/linux-install-runtime-deps.sh

      - name: Install Raku dependencies
        run: zef install --deps-only .

      - name: Run tests
        env:
          LD_LIBRARY_PATH: ${{ github.workspace }}/resources/libraries
        run: zef test -v .
